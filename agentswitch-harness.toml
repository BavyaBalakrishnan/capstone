# Graded run configuration (Release 8.1).
#
# timeout_minutes is their maximum, 30, against our own internal budget of 26:
# the runner stops STARTING tasks with 90 seconds
# of its own budget left and finalises results.json itself, so the platform's
# cap is a backstop rather than the thing that ends the run. A run killed at the
# cap would still leave a valid file - results.json is rewritten atomically
# after every task - but we would rather finish deliberately than be stopped.

install = "pip install -r requirements.txt"
run = "python -m seat15.harness.official"
results = "results.json"
# KEYSTONE ONLY for this run, deliberately. Suryodaya scored 15 of 16 on 16
# October and its one failure (i04) is a judgement call we have decided not to
# patch, so another run there would re-learn what we know. Every open question
# is on Keystone: whether the finish-guard fix works (h01), whether the retry
# ceiling frees enough budget to reach s02, and d03.
#
# Listing one instance does not halve the work - when only suryodaya was listed
# the platform ran both servers and both executed the Suryodaya set. So this
# should give two runs of the Keystone tasks, which is worth having: a single
# run of a model is a sample, and four tasks have flipped between runs this
# month.
instances = ["keystone"]
timeout_minutes = 30
