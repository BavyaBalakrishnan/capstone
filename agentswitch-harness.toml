# Graded run configuration (Release 8.1).
#
# timeout_minutes is their maximum, 30, against our own internal budget of 26:
# the runner stops STARTING tasks with 90 seconds
# of its own budget left and finalises results.json itself, so the platform's
# cap is a backstop rather than the thing that ends the run. A run killed at the
# cap would still leave a valid file - results.json is rewritten atomically
# after every task - but we would rather finish deliberately than be stopped.

install = "pip install -r requirements.txt"
run = "python -m seat15.harness.official"
results = "results.json"
# ONE instance per graded run, from 2026-10-19 evening, Suryodaya first.
#
# This list decides what runs; the button pressed in the UI does not. Listing
# only Suryodaya once before meant the run labelled Keystone graded the
# Suryodaya set, so d03 and h01 were never graded at all. So: change this line
# between submissions, and never assume the label picked the instance.
#
# Separately rather than together because the two shared a 26-minute budget and
# Keystone used 24 of it. Alone, each gets the whole budget, and time is what
# we have lost tasks to.
#
# Suryodaya was submitted from this file at 16 of 16 local / 16 of 16 graded.
# Keystone is now 14 of 15 local on this commit - d03 the only failure, and it
# is deliberately unresolved (see its task file). Switched to keystone for the
# second submission.
#
# Note on how Keystone was measured: the budgeted run reached 13 of its 15
# tasks in 23 minutes and reported the last two as "not reached", because the
# provider was answering at ~8.5s per call rather than ~1.9s. q01 and s02 were
# then run on their own through the same run_one/judge path and both approved.
# So every Keystone task is measured, but not all of them inside one 26-minute
# budget at that speed. If the endpoint is slow at grading time, expect the
# last task or two to come back "not reached" - that is the pacing logic
# protecting the budget, not a failure.
# Semantic coverage is OFF. SEAT15_SEMANTIC_KB=1 enables it; do not, without
# reading D03_WHY_IT_FAILS.md first.
#
# The graded Keystone run with it on scored 13 of 15 against 14 of 15 without:
# it did not fix d03, and it cost s03. Three signals for "does this article
# answer this ticket" have now been measured and all three fail - lexical
# overlap is inverted, the embedding margin does not generalise beyond the
# handful of cases it was fitted to, and a model judge is model-dependent,
# which is fatal when the grading model is not ours.
instances = ["keystone"]
timeout_minutes = 30
